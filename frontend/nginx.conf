server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real file resolves to
    # index.html so React Router handles client-side routes like
    # /greenhouses/gh_001 instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets never change content under a given name -
    # safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
