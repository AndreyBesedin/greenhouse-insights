[project]
name = "greenhouse-insights-backend"
version = "0.1.0"
description = "Greenhouse Intelligence POC backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "numpy>=2.0",
    "alembic>=1.13",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) default-argument pattern is idiomatic, not a real
# mutable-default hazard.
"application/api/**" = ["B008"]
# Alembic generates these from a template we do not control; do not hold
# them to house style.
"alembic/versions/**" = ["I001", "UP035", "F401", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["domain", "simulation", "management", "intelligence", "evaluation", "application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests excluded from the pre-commit fast pass",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "simulation*", "management*", "intelligence*", "evaluation*", "application*"]
