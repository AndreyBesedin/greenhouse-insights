[project]
name = "greenhouse-insights-backend"
version = "0.1.0"
description = "Greenhouse Intelligence POC backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["domain", "simulation", "intelligence", "evaluation", "application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests excluded from the pre-commit fast pass",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "simulation*", "intelligence*", "evaluation*", "application*"]
