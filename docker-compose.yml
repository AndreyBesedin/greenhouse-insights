services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greenhouse
      POSTGRES_DB: greenhouse
      # Set POSTGRES_PASSWORD in the shell or a top-level .env next to this
      # file for anything but a throwaway local run.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenhouse}
    volumes:
      - greenhouse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse -d greenhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Copy backend/.env.example to backend/.env and fill in real values
    # (ANTHROPIC_API_KEY etc.) before running this.
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever GREENHOUSE_ALLOWED_ORIGINS is in .env: the
      # frontend container below is what actually calls this API, and it is
      # reachable from the browser at localhost:8080 (the host port mapping
      # on the frontend service), not at a docker-network hostname.
      GREENHOUSE_ALLOWED_ORIGINS: http://localhost:8080
      # The application database is the postgres service above; the app
      # applies migrations on startup. This overrides any SQLite URL in .env.
      GREENHOUSE_DATABASE_URL: postgresql+psycopg://greenhouse:${POSTGRES_PASSWORD:-greenhouse}@postgres:5432/greenhouse
      # Dataset tiers (raw / canonical / features) live on the volume below
      # rather than in the image's home directory.
      GREENHOUSE_DATA_DIR: /app/data
      # Local docker compose is a development deployment; a real one sets
      # a real mode and its identity-provider configuration.
      GREENHOUSE_AUTH_MODE: ${GREENHOUSE_AUTH_MODE:-dev}
      GREENHOUSE_PLATFORM_ADMIN_SUBJECTS: ${GREENHOUSE_PLATFORM_ADMIN_SUBJECTS:-dev-admin}
    volumes:
      - greenhouse_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the built JS at image-build time (Vite env vars are
        # compile-time). Must be reachable from the browser, not the docker
        # network - hence localhost:8000 (the backend's host port mapping
        # above), not http://backend:8000.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  greenhouse_postgres:
  greenhouse_data:
